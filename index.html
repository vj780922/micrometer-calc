<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分厘卡器差值計算器 - Weiwei</title>
    <style>
        /* 字型設定：英文 Calibri, 中文 微軟正黑體 */
        body {
            font-family: "Calibri", "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f9;
            color: #2d3748;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 25px 20px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        @media (min-width: 576px) {
            .card {
                padding: 35px;
            }
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #1a365d;
            font-size: 24px;
            margin-bottom: 25px;
        }

        .section-label {
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
            color: #3182ce;
            border-left: 4px solid #3182ce;
            padding-left: 10px;
            font-size: 16px;
        }

        /* 預設（電腦版）網格佈局 */
        .header-row {
            display: grid;
            grid-template-columns: 1.2fr repeat(3, 1fr) 1.2fr;
            gap: 10px;
            font-size: 13px;
            color: #718096;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .row-item {
            display: grid;
            grid-template-columns: 1.2fr repeat(3, 1fr) 1.2fr;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        /* 平行度專用：橫跨 3 格量測值的寬度，且寬度與上方欄位等寬對齊 */
        .para-span-3 {
            grid-column: span 3;
            width: 100%;
        }

        /* 手機版專用標籤，電腦版隱藏 */
        .mobile-label {
            display: none;
        }

        input[type="number"] {
            width: 100%;
            padding: 11px 8px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px; /* 防止 iOS 點擊時畫面自動縮放 */
            box-sizing: border-box;
            outline: none;
            text-align: right;
            font-family: "Calibri", "Microsoft JhengHei";
            background-color: #eef5fc; 
            transition: all 0.2s;
        }

        /* 修改 Placeholder 顏色，讓 0.000 提示清晰可見 */
        input[type="number"]::placeholder {
            color: #a0aec0;
            opacity: 0.8;
            text-align: right;
        }

        input[type="number"]:focus {
            border-color: #3182ce;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }

        /* 標準值輸入框專用（置中對齊） */
        .std-val {
            text-align: center !important;
            font-weight: bold;
            background-color: #f7fafc;
            border-color: #cbd5e0;
        }

        .calc-res {
            font-size: 15px;
            font-weight: bold;
            color: #2d3748;
            text-align: center;
            font-family: "Calibri", sans-serif;
            padding: 5px 0;
        }

        .waiting {
            color: #a0aec0;
            font-style: italic;
            font-size: 13px;
            font-weight: normal;
        }

        .result-area {
            margin-top: 25px;
            padding: 20px;
            background-color: #ebf8ff;
            border-radius: 12px;
            border: 1px solid #bee3f8;
        }

        .result-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }

        .final-status {
            font-size: 22px;
        }

        .status-pass {
            color: #38a169;
        }

        .status-fail {
            color: #e53e3e;
        }

        .status-wait {
            color: #718096;
            font-size: 18px;
            font-style: italic;
            font-weight: normal;
        }

        .tolerance-badge {
            background-color: #fffaf0;
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid #feebc8;
            color: #dd6b20;
            font-size: 14px;
        }

        .divider {
            border: 0;
            border-top: 1px dashed #e2e8f0;
            margin: 20px 0;
        }

        .footer-info {
            text-align: center;
            font-size: 13px;
            color: #718096;
            line-height: 2;
        }

        .visit-badge {
            background: #e2e8f0;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
            color: #4a5568;
            margin-left: 5px;
        }

        .clear-btn {
            width: 100%;
            padding: 14px;
            background-color: #edf2f7;
            color: #4a5568;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
            font-family: "Microsoft JhengHei";
        }

        .clear-btn:hover {
            background-color: #e2e8f0;
        }

        /* 隱藏輸入框的上下調節箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* ==========================================================================
           RWD 手機版樣式微調 (螢幕寬度小於 550px 時觸發)
           ========================================================================== */
        @media (max-width: 550px) {
            .header-row {
                display: none;
            }

            .row-item {
                display: flex;
                flex-direction: column;
                background: #f8fafc;
                padding: 14px;
                border-radius: 10px;
                margin-bottom: 16px;
                border: 1px solid #edf2f7;
            }

            .input-group-mobile {
                display: grid;
                grid-template-columns: 80px 1fr;
                align-items: center;
                width: 100%;
                margin-bottom: 8px;
            }

            .para-span-3 {
                display: grid;
                grid-template-columns: 80px 1fr;
                align-items: center;
                width: 100%;
                margin-bottom: 8px;
            }

            .mobile-label {
                display: block;
                font-size: 13px;
                color: #4a5568;
                font-weight: bold;
                text-align: left;
                padding-left: 4px;
            }

            .calc-res {
                width: 100%;
                text-align: right;
                padding: 8px 4px 0 4px;
                box-sizing: border-box;
                border-top: 1px dashed #e2e8f0;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>分厘卡器差值計算器</h2>

        <div class="header-row">
            <div>標準值</div>
            <div>量測值 1</div>
            <div>量測值 2</div>
            <div>量測值 3</div>
            <div>器差值結果</div>
        </div>

        <span class="section-label">外徑校正</span>
        <div class="row-item od-row">

            <div class="input-group-mobile"><span class="mobile-label">量測值 1</span><input type="number" step="0.001" class="m1-val" placeholder="0.000" oninput="calculate()" onblur="formatToThreeDecimals(this)"></div>
            <div class="input-group-mobile"><span class="mobile-label">量測值 2</span><input type="number" step="0.001" class="m2-val" placeholder="0.000" oninput="calculate()" onblur="formatToThreeDecimals(this)"></div>
            <div class="input-group-mobile"><span class="mobile-label">量測值 3</span><input type="number" step="0.001" class="m3-val" placeholder="0.000" oninput="calculate()" onblur="formatToThreeDecimals(this)"></div>
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>

            <div class="input-group-mobile"><span class="mobile-label">量測值 1</span><input type="number" step="0.001" class="m1-val" placeholder="0.000" oninput="calculate()" onblur="formatToThreeDecimals(this)"></div>
            <div class="input-group-mobile"><span class="mobile-label
